[package]
name = "vocs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
ashpd = { version = "0.13.13", features = ["remote_desktop", "screencast"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
dotenvy = "0.15"
enumflags2 = "0.7"
gio = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
pipewire = "0.10.1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit-wayland", "renderer-software"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18"
