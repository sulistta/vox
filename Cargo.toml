[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/protocol",
    "crates/policy",
    "crates/broker",
    "crates/tool-runtime",
    "crates/desktop-access",
    "crates/session-store",
    "crates/secrets",
    "crates/supervisor",
    "crates/audio-capture",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
sha2 = "0.10.9"
hex = "0.4.3"
crossbeam-channel = "0.5.15"
libc = "0.2.176"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.2"
xa11y = { version = "0.14.0", default-features = false }
